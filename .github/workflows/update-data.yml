name: Update Pskov Date Data

on:
  schedule:
    # Каждый день в 06:00 UTC (09:00 МСК)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run Pskov scraper
        run: python scraper/parse_pskov.py

      - name: Commit updated places.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          git diff --staged --quiet || git commit -m "chore: update Pskov places and events"
          git push
